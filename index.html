<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>午休静校</title>
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: "Microsoft YaHei", "SimHei", "黑体", "PingFang SC", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    cursor: none;
  }

  .container {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    align-items: center;
    padding: 3vh 0;
  }

  .text-return {
    font-size: min(4.5vw, 7vh);
    font-weight: 400;
    letter-spacing: 0.3em;
    opacity: 0.9;
  }

  .char-jing {
    font-size: min(38vw, 50vh);
    font-weight: 700;
    line-height: 1;
    text-align: center;
    width: 100%;
    text-indent: 0.5em;
    text-shadow: 0 0 8vw rgba(255,255,255,0.12);
  }

  .text-time-range {
    font-size: min(3.2vw, 4.5vh);
    font-weight: 300;
    letter-spacing: 0.2em;
    opacity: 0.7;
  }

  .countdown {
    font-size: min(10vw, 13vh);
    font-weight: 600;
    letter-spacing: 0.15em;
    font-variant-numeric: tabular-nums;
    font-family: "Consolas", "Microsoft YaHei", "SimHei", monospace;
  }

  .countdown.ended {
    font-size: min(5vw, 7vh);
    color: #ccc;
  }

  .char-jing.ended-text {
    font-size: min(20vw, 28vh);
    text-indent: 0;
  }

  /* 点击启动遮罩 */
  .overlay {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    cursor: pointer;
    flex-direction: column;
    gap: 2vh;
  }
  .overlay.hidden {
    display: none;
  }
  .overlay-text {
    font-size: 3vw;
    color: #aaa;
    letter-spacing: 0.2em;
    animation: pulse 2s ease-in-out infinite;
  }
  .overlay-icon {
    font-size: 8vw;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  /* 右下角退出热区 */
  .exit-zone {
    position: fixed;
    bottom: 0;
    right: 0;
    width: 80px;
    height: 80px;
    z-index: 9998;
    cursor: default;
  }
</style>
</head>
<body>

<!-- 点击启动遮罩 -->
<div class="overlay" id="overlay">
  <div class="overlay-icon">▶</div>
  <div class="overlay-text">点击屏幕开始午休静校</div>
</div>

<!-- 右下角退出热区 -->
<div class="exit-zone" id="exitZone"></div>

<!-- 主画面 -->
<div class="container" id="container">
  <div class="text-return" id="textTop">午休期间 请保持安</div>
  <div class="char-jing" id="textJing">静！</div>
  <div class="text-time-range" id="textRange">（13:10 ~ 13:55）</div>
  <div class="countdown" id="countdown">--:--:--</div>
</div>

<script>
(function() {
  'use strict';

  // ============ 配置 ============
  const TARGET_PRE_HOUR = 13;
  const TARGET_PRE_MINUTE = 10;
  const TARGET_HOUR = 13;
  const TARGET_MINUTE = 55;
  const TARGET_SECOND = 0;
  const EXIT_TAP_COUNT = 5;
  const EXIT_TAP_WINDOW = 3000; // ms

  // ============ DOM 引用 ============
  const overlay = document.getElementById('overlay');
  const countdownEl = document.getElementById('countdown');
  const textTop = document.getElementById('textTop');
  const textJing = document.getElementById('textJing');
  const textRange = document.getElementById('textRange');
  const exitZone = document.getElementById('exitZone');

  // ============ 调试模式 ============
  const urlParams = new URLSearchParams(window.location.search);
  const debugH = urlParams.get('h');
  const debugM = urlParams.get('m');
  const debugS = urlParams.get('s') || '0';
  const isDebug = (debugH !== null && debugM !== null);

  function getNow() {
    if (isDebug) {
      const now = new Date();
      return new Date(now.getFullYear(), now.getMonth(), now.getDate(),
                      parseInt(debugH), parseInt(debugM), parseInt(debugS), 0);
    }
    return new Date();
  }

  // ============ 状态 ============
  let countdownInterval = null;
  let isLocked = false;
  let currentMode = 'pre';     // 'pre' | 'main' | 'ended'
  let exitTapCount = 0;
  let exitTapTimer = null;
  let endedClickHandler = null;

  // ============ 倒计时 ============
  function getTargetTime(hour, minute) {
    const now = getNow();
    return new Date(now.getFullYear(), now.getMonth(), now.getDate(),
                    hour, minute, TARGET_SECOND, 0);
  }

  function getRemainingSeconds() {
    const now = getNow();
    if (currentMode === 'pre') {
      const target = getTargetTime(TARGET_PRE_HOUR, TARGET_PRE_MINUTE);
      return Math.max(0, Math.floor((target - now) / 1000));
    }
    const target = getTargetTime(TARGET_HOUR, TARGET_MINUTE);
    return Math.max(0, Math.floor((target - now) / 1000));
  }

  function detectMode() {
    const now = getNow();
    // 13:10 之前 → pre 模式
    if (now < getTargetTime(TARGET_PRE_HOUR, TARGET_PRE_MINUTE)) {
      return 'pre';
    }
    // 13:55 之前 → main 模式
    if (now < getTargetTime(TARGET_HOUR, TARGET_MINUTE)) {
      return 'main';
    }
    // 已过 13:55 → ended
    return 'ended';
  }

  function formatTime(totalSeconds) {
    const h = Math.floor(totalSeconds / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = totalSeconds % 60;
    return [h, m, s].map(n => String(n).padStart(2, '0')).join(':');
  }

  function switchToMainMode() {
    currentMode = 'main';
    textTop.textContent = '午休期间 请保持安';
    textJing.textContent = '静！';
    textRange.textContent = '（13:10 ~ 13:55）';
    textJing.classList.remove('ended-text');
    countdownEl.classList.remove('ended');
    updateCountdown();
  }

  function updateCountdown() {
    const remaining = getRemainingSeconds();

    if (currentMode === 'pre' && remaining <= 0) {
      // 预倒计时结束 → 切换到主模式
      switchToMainMode();
      return;
    }

    countdownEl.textContent = formatTime(remaining);

    if (currentMode === 'main' && remaining <= 0) {
      // 主倒计时结束
      stopCountdown();
      onTimeUp();
    }
  }

  function startCountdown() {
    updateCountdown();
    countdownInterval = setInterval(updateCountdown, 500);
  }

  function stopCountdown() {
    if (countdownInterval) {
      clearInterval(countdownInterval);
      countdownInterval = null;
    }
  }

  // ============ 结束处理 ============
  function onTimeUp() {
    currentMode = 'ended';
    countdownEl.textContent = '00:00:00';
    countdownEl.classList.add('ended');

    // 切换画面：显示结束提示
    textTop.textContent = '午休时间已结束';
    textJing.textContent = '结束';
    textJing.classList.add('ended-text');
    textRange.textContent = '轻触屏幕关闭';

    // 点击任意位置关闭
    endedClickHandler = function() {
      document.removeEventListener('click', endedClickHandler);
      tryCloseWindow();
    };
    document.addEventListener('click', endedClickHandler);
  }

  // ============ 窗口关闭 ============
  function tryCloseWindow() {
    if (window.electronAPI && window.electronAPI.closeApp) {
      window.electronAPI.closeApp();
      return;
    }
    window.close();
    if (window.opener) {
      window.opener = window;
      window.close();
    }
    setTimeout(() => {
      if (!document.hidden) {
        document.body.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;width:100vw;height:100vh;background:#000;color:#fff;font-size:5vw;font-family:Microsoft YaHei,sans-serif;">午休结束，请关闭窗口</div>';
      }
    }, 1000);
  }

  // ============ 全屏控制 ============
  function requestFullscreen() {
    const el = document.documentElement;
    if (el.requestFullscreen) {
      el.requestFullscreen().catch(() => {});
    } else if (el.webkitRequestFullscreen) {
      el.webkitRequestFullscreen();
    } else if (el.msRequestFullscreen) {
      el.msRequestFullscreen();
    }
  }

  function isFullscreen() {
    return !!(document.fullscreenElement ||
              document.webkitFullscreenElement ||
              document.msFullscreenElement);
  }

  function onFullscreenChange() {
    if (!isFullscreen() && isLocked && currentMode !== 'ended') {
      setTimeout(requestFullscreen, 100);
    }
  }

  // ============ 页面可见性 ============
  function onVisibilityChange() {
    if (document.hidden && isLocked && currentMode !== 'ended') {
      window.focus();
    }
  }

  // ============ 键盘拦截 ============
  function onKeyDown(e) {
    if (!isLocked) return;

    const blocked = [
      'Escape', 'F11',
      'AltLeft', 'AltRight',
      'MetaLeft', 'MetaRight',
      'F1', 'F2', 'F3', 'F4', 'F5', 'F6', 'F7', 'F8', 'F9', 'F10', 'F12',
      'BrowserHome', 'BrowserSearch', 'BrowserFavorites',
      'LaunchMail', 'LaunchMediaSelect', 'LaunchApp1', 'LaunchApp2',
      'ContextMenu',
    ];

    if (blocked.includes(e.code) || blocked.includes(e.key)) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }

    if (e.ctrlKey) {
      const blockedCtrl = [
        'KeyW', 'KeyT', 'KeyN',
        'KeyD', 'KeyH', 'KeyJ',
        'KeyO', 'KeyU', 'KeyP', 'KeyS',
        'Digit1', 'Digit2', 'Digit3', 'Digit4', 'Digit5',
        'Digit6', 'Digit7', 'Digit8', 'Digit9',
        'Tab', 'F4',
        'ShiftLeft', 'ShiftRight',
      ];
      if (blockedCtrl.includes(e.code) || e.key === 'Tab' || e.key === 'F4') {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }
    }

    if (e.altKey) {
      const blockedAlt = ['F4', 'Tab', 'Space', 'Enter', 'Home', 'End', 'ArrowLeft', 'ArrowRight'];
      if (blockedAlt.includes(e.key) || blockedAlt.includes(e.code)) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }
      if (e.code && e.code.startsWith('Key')) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }
    }
  }

  function onContextMenu(e) {
    if (isLocked) {
      e.preventDefault();
      return false;
    }
  }

  // ============ 右下角5连击退出 ============
  exitZone.addEventListener('click', function(e) {
    if (!isLocked) return;
    e.stopPropagation();
    exitTapCount++;

    if (exitTapCount >= EXIT_TAP_COUNT) {
      isLocked = false;
      stopCountdown();
      clearTimeout(exitTapTimer);

      // 退出全屏
      if (document.exitFullscreen) {
        document.exitFullscreen().catch(() => {});
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }

      // 移除事件监听
      document.removeEventListener('fullscreenchange', onFullscreenChange);
      document.removeEventListener('webkitfullscreenchange', onFullscreenChange);
      document.removeEventListener('msfullscreenchange', onFullscreenChange);
      document.removeEventListener('visibilitychange', onVisibilityChange);
      document.removeEventListener('keydown', onKeyDown, true);
      document.removeEventListener('contextmenu', onContextMenu, true);
      window.removeEventListener('beforeunload', beforeUnloadHandler);

      if (endedClickHandler) {
        document.removeEventListener('click', endedClickHandler);
      }

      tryCloseWindow();
      return;
    }

    // 重置计时器
    clearTimeout(exitTapTimer);
    exitTapTimer = setTimeout(() => { exitTapCount = 0; }, EXIT_TAP_WINDOW);
  });

  // ============ beforeunload ============
  function beforeUnloadHandler(e) {
    if (isLocked) {
      e.preventDefault();
      e.returnValue = '午休中，确定要关闭吗？';
      return e.returnValue;
    }
  }

  // ============ 启动流程 ============
  function startLockdown() {
    overlay.classList.add('hidden');
    isLocked = true;

    requestFullscreen();
    startCountdown();

    document.addEventListener('fullscreenchange', onFullscreenChange);
    document.addEventListener('webkitfullscreenchange', onFullscreenChange);
    document.addEventListener('msfullscreenchange', onFullscreenChange);
    document.addEventListener('visibilitychange', onVisibilityChange);
    document.addEventListener('keydown', onKeyDown, true);
    document.addEventListener('contextmenu', onContextMenu, true);
    window.addEventListener('beforeunload', beforeUnloadHandler);

    document.addEventListener('dragstart', e => e.preventDefault());
    document.addEventListener('selectstart', e => { if (isLocked) e.preventDefault(); });

    setInterval(() => {
      if (isLocked && !isFullscreen() && currentMode !== 'ended') {
        requestFullscreen();
      }
    }, 2000);
  }

  // ============ 初始化 ============
  function init() {
    currentMode = detectMode();

    if (currentMode === 'ended') {
      countdownEl.textContent = '00:00:00';
      countdownEl.classList.add('ended');
      textTop.textContent = '午休时间已结束';
      textJing.textContent = '结束';
      textJing.classList.add('ended-text');
      textRange.textContent = '轻触屏幕关闭';
      overlay.querySelector('.overlay-text').textContent = '午休时间已结束';
      overlay.querySelector('.overlay-icon').textContent = '✓';
      overlay.addEventListener('click', () => { tryCloseWindow(); });
      document.addEventListener('click', () => { tryCloseWindow(); });
      return;
    }

    if (currentMode === 'pre') {
      // 预倒计时模式
      textTop.textContent = '距离午自习开始还有';
      overlay.querySelector('.overlay-text').textContent = '点击开始午休静校';
    } else {
      // 主模式
      textTop.textContent = '午休期间 请保持安';
      textJing.textContent = '静！';
      textRange.textContent = '（13:10 ~ 13:55）';
      overlay.querySelector('.overlay-text').textContent = '点击开始午休静校';
    }

    const remaining = getRemainingSeconds();
    countdownEl.textContent = formatTime(remaining);

    // 检测 Electron 环境
    const isElectron = !!(window.electronAPI && window.electronAPI.closeApp);

    if (isElectron) {
      startLockdown();
      return;
    }

    // Web 版：手动启动
    overlay.addEventListener('click', startLockdown);

    document.addEventListener('keydown', function startKey(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        document.removeEventListener('keydown', startKey);
        startLockdown();
      }
    });

    const params = new URLSearchParams(window.location.search);
    if (params.get('auto') === '1') {
      setTimeout(startLockdown, 500);
    }
  }

  init();

})();
</script>
</body>
</html>
